<section class="page-shell view-enter">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ editing ? 'Edit NPC' : 'New NPC' }}</h1>
      <p class="page-subtitle">Capture the essentials now. Expand the dossier when you have more lore.</p>
    </div>
    <a [routerLink]="backLink()" class="btn btn-secondary">Back</a>
  </header>

  <form class="npc-form glass-panel" [formGroup]="form" (ngSubmit)="submit()">
    <section class="form-section">
      <h2>At a glance</h2>
      <div class="grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" formControlName="name" />
        </div>
        <div class="field">
          <label for="aliases">Aliases (comma-separated)</label>
          <input id="aliases" type="text" formControlName="aliases" placeholder="The Pale Merchant, Old Tom" />
        </div>
        <div class="field">
          <label for="role">Role / Occupation</label>
          <input id="role" type="text" formControlName="role_occupation" />
        </div>
        <div class="field">
          <label for="alignment">Alignment</label>
          <select id="alignment" formControlName="alignment">
            @for (item of alignments; track item.code) {
              <option [value]="item.code">{{ item.label }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="catalog_location">Catalog location (optional)</label>
          <select id="catalog_location" formControlName="location_id">
            <option value="">None</option>
            @for (place of campaignLocations; track place.id) {
              <option [value]="place.id">{{ place.title }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="location">Location notes (optional)</label>
          <input
            id="location"
            type="text"
            formControlName="location"
            placeholder="Free-text detail, e.g. back room, dock 3…"
          />
        </div>
        <div class="field">
          <label for="faction">Faction (optional)</label>
          <input id="faction" type="text" formControlName="faction" />
        </div>
        <div class="field">
          <label for="attitude">Attitude</label>
          <input id="attitude" type="text" formControlName="attitude" placeholder="Wary, friendly, hostile…" />
        </div>
        <div class="field">
          <label for="relationship">Relationship to Party</label>
          <input id="relationship" type="text" formControlName="party_relationship" />
        </div>
        <div class="field span-2">
          <label for="tags">Tags / Keywords (comma-separated)</label>
          <input id="tags" type="text" formControlName="tags" placeholder="informant, dockside, quest-giver" />
        </div>
        <div class="field span-2">
          <label for="image">Portrait (optional)</label>
          <input id="image" type="file" accept="image/*" (change)="onFileSelected($event)" />
          <app-ai-image-generate
            kind="npc"
            [fields]="aiPromptFields()"
            [disabled]="saving"
            (imageChosen)="onAiImageChosen($event)"
          />
          @if (previewUrl || currentImage) {
            <div class="image-preview">
              <img [src]="previewUrl || currentImage" alt="NPC portrait" />
              <button type="button" class="btn btn-secondary btn-clear-image" (click)="clearImage()">
                Remove
              </button>
            </div>
          }
        </div>
      </div>
    </section>

    <section class="form-section dossier">
      <button type="button" class="dossier-toggle" (click)="toggleDossier()">
        <h2>Dossier</h2>
        <span>{{ dossierOpen ? 'Hide' : 'Show' }} optional fields</span>
      </button>

      @if (dossierOpen) {
        <div class="grid dossier-grid">
          <div class="span-2">
            <app-markdown-field formControlName="appearance" label="Appearance" inputId="appearance" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="voice_mannerisms" label="Voice / Accent / Mannerisms" inputId="voice_mannerisms" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="personality_traits" label="Personality Traits" inputId="personality_traits" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="motivation_goal" label="Motivation / Goal" inputId="motivation_goal" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="secret_hook" label="Secret / Hook" inputId="secret_hook" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="knowledge" label="Knowledge / What They Know" inputId="knowledge" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="inventory" label="Inventory / Notable Items" inputId="inventory" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="dm_notes" label="DM Notes" inputId="dm_notes" />
          </div>
          <div class="span-2">
            <app-markdown-field formControlName="session_log" label="Session Log / Campaign History" inputId="session_log" />
          </div>
        </div>
      }
    </section>

    @if (error) {
      <p class="form-error">{{ error }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="saving">
      {{ saving ? 'Saving…' : editing ? 'Save NPC' : 'Create NPC' }}
    </button>
  </form>
</section>
