<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Side Commuter Rail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <nav class="site-nav" aria-label="Primary">
            <a class="nav-btn" href="/">NPC Catalog</a>
            <a class="nav-btn is-active" href="/trains/" aria-current="page">South Side Rail</a>
          </nav>
          <h1>South Side Rail</h1>
        </div>
        <div class="meta">
          <span id="clock"></span>
          <span id="refresh-status" class="status">Loading…</span>
        </div>
      </header>
      <main class="layout">
        <section class="map-pane" aria-label="Route map">
          <div id="map"></div>
        </section>
        <aside class="board-pane" aria-label="Arrivals board">
          <div class="board-header">
            <h2>Upcoming stops</h2>
            <label class="filter">
              Line
              <select id="route-filter">
                <option value="">All south side</option>
              </select>
            </label>
          </div>
          <ul id="arrivals" class="arrivals"></ul>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
